name: Update GU Stats

on:
  # WORKFLOW_TRIGGER_ON_PUSH_V1_2026_07_20 — push trigger added so fixes deploy immediately (cron */15 has multi-hour delays)
  schedule:
    - cron: '*/15 * * * *'   # every 15 minutes
  push:
    branches: [main]
    paths:
      - 'fetch_and_push.py'
      - 'gu_parser.py'
      - '.github/workflows/update.yml'
      - 'regression_tests_gu_titles.json'
  workflow_dispatch: {}       # allow manual run

permissions:
  contents: write             # to commit videos.json

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install playwright requests Pillow
          playwright install --with-deps chromium

      # DERIVED_FEED_CONSISTENCY_V1_2026_08_23 — verify the COMMITTED state, before
      # this run regenerates anything. Running it after the fetch would be
      # circular: the same process just wrote the feed, so it would always agree.
      # What this catches is the gap that actually bit us — something writing
      # videos.json without running the generator (an out-of-band repair, or the
      # bridge discarding a regenerated weekly file), leaving the leaderboard
      # disagreeing with the canonical feed with nothing to say so.
      #
      # continue-on-error: a stale derived feed must be LOUD, not block the stats
      # pipeline — the next run republishes the feed anyway, and failing the job
      # would stop good data from shipping over a reporting-layer disagreement.
      # Same fail-open-but-visible rule the EPISODE_UNION guard already follows.
      - name: Verify derived feeds match canonical sources
        continue-on-error: true
        run: python3 verify_derived_feeds_v1.py

      - name: Fetch fresh data (videos.json + followers.json)
        env:
          X_COOKIES_JSON: ${{ secrets.X_COOKIES_JSON }}
          IG_COOKIES_JSON: ${{ secrets.IG_COOKIES_JSON }}
        run: python3 -c "import asyncio, fetch_and_push; asyncio.run(fetch_and_push.main_fetch())"

      - name: Track drops vs peaks
        run: python3 track_drops.py

      - name: Push to Tidbyts (with drop alerts if any)
        env:
          TIDBYT_KEY_1: ${{ secrets.TIDBYT_KEY_1 }}
          TIDBYT_KEY_2: ${{ secrets.TIDBYT_KEY_2 }}
        run: python3 -c "import fetch_and_push; fetch_and_push.push_to_tidbyt()"

      - name: Commit updated JSON
        run: |
          git config user.name "GU Stats Bot"
          git config user.email "bot@github.com"
          mkdir -p docs && touch docs/audit_queue_unclassified_v1.jsonl docs/audit_queue_url_bind_v1.jsonl && git add videos.json videos_neworder.json videos_health_v1.json followers.json peaks.json drops.md drops_current.json stats_1week_gu.json stats_1week_no.json docs/audit_queue_unclassified_v1.jsonl docs/audit_queue_url_bind_v1.jsonl
          git diff --cached --quiet && exit 0
          # AUDIT_LOG_SURVIVES_RESET_V1_2026_08_23 — the two docs/*.jsonl audit
          # logs are append-only, and they were absent from the save/restore
          # lists below. `git reset --hard origin/main` therefore discarded
          # every line CI wrote and the `touch` re-created them empty, so no
          # bot run has ever committed an audit line since 2026-07-20.
          # Capture only the bytes THIS run appended, then re-append after each
          # reset, so a concurrent run's lines are preserved, not overwritten.
          mkdir -p /tmp/gu_audit
          for f in docs/audit_queue_unclassified_v1.jsonl docs/audit_queue_url_bind_v1.jsonl; do
            base=$(git show "HEAD:$f" 2>/dev/null | wc -c | tr -d ' ')
            [ -n "$base" ] || base=0
            if [ -f "$f" ]; then
              tail -c "+$((base + 1))" "$f" > "/tmp/gu_audit/$(basename "$f").delta"
              echo "  [AUDIT] $f: base=${base}B appended=$(wc -c < "/tmp/gu_audit/$(basename "$f").delta" | tr -d ' ')B"
            fi
          done
          # v2: robust push - save files, fetch+reset to latest remote, restore, recommit
          for f in videos.json videos_neworder.json videos_health_v1.json followers.json peaks.json drops.md drops_current.json stats_1week_gu.json stats_1week_no.json; do
            [ -f "$f" ] && cp "$f" "/tmp/gu_${f//./_}"
          done
          for attempt in 1 2 3; do
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main
            for f in videos.json videos_neworder.json videos_health_v1.json followers.json peaks.json drops.md drops_current.json stats_1week_gu.json stats_1week_no.json; do
              [ -f "/tmp/gu_${f//./_}" ] && cp "/tmp/gu_${f//./_}" "$f"
            done
            # AUDIT_LOG_SURVIVES_RESET_V1_2026_08_23 — replay this run's audit
            # lines on top of whatever origin/main now holds.
            for f in docs/audit_queue_unclassified_v1.jsonl docs/audit_queue_url_bind_v1.jsonl; do
              d="/tmp/gu_audit/$(basename "$f").delta"
              if [ -s "$d" ]; then
                mkdir -p docs && cat "$d" >> "$f"
              fi
            done
            mkdir -p docs && touch docs/audit_queue_unclassified_v1.jsonl docs/audit_queue_url_bind_v1.jsonl && git add videos.json videos_neworder.json videos_health_v1.json followers.json peaks.json drops.md drops_current.json stats_1week_gu.json stats_1week_no.json docs/audit_queue_unclassified_v1.jsonl docs/audit_queue_url_bind_v1.jsonl
            git diff --cached --quiet && exit 0
            git commit -m "Update stats $(date -u +%H:%M)"
            git push && exit 0
            echo "Push attempt $attempt failed, retrying in $((attempt * 5))s..."
            sleep $((attempt * 5))
          done
          exit 1
